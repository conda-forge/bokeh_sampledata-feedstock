{% set python_min = "3.10" %}
{% set name = "bokeh_sampledata" %}
{% set version = "2026.3" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/bokeh_sampledata-{{ version }}.tar.gz
  sha256: 9d2dc8d041673acc3db003ed3d8899d75785076f16f697b78ff54cf2566c4681

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=69.5.1
    - setuptools-git-versioning
    - pip
  run:
    - python >={{ python_min }}
    - icalendar
    - pandas >=2.2.3
    - numpy >=1.26.4
    - shapely >=2.0
    - tzdata

test:
  imports:
    - bokeh_sampledata
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Sample datasets for Bokeh examples
  license: BSD-3-Clause
  license_file: LICENSE.txt
  home: https://bokeh.org/

extra:
  recipe-maintainers:
    - hoxbro
