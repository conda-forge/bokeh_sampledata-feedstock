{% set python_min = "3.10" %}
{% set name = "bokeh_sampledata" %}
{% set version = "2026.1" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/bokeh_sampledata-{{ version }}.tar.gz
  sha256: fb45cbdc8e1562fe02d537248c2996ed98ede0ceaa95d51542b69a14732e825e

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=69.5.1
    - setuptools-git-versioning
    - pip
  run:
    - python >={{ python_min }}
    - icalendar
    - pandas >=2.2.3
    - numpy >=1.26.4
    - shapely >=2.0
    - tzdata

test:
  imports:
    - bokeh_sampledata
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Sample datasets for Bokeh examples
  license: BSD-3-Clause
  license_file: LICENSE.txt
  home: https://bokeh.org/

extra:
  recipe-maintainers:
    - hoxbro
